<text x="490" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">How the 3 External Validation Tests Work (Q6 &amp; S4)</text>
<text x="490" y="60" text-anchor="middle" font-size="13.5" fill="#475569">Testing whether the 6 clusters differ on variables withheld from clustering: AI Usage (Q6) and Year of Study (S4)</text>
