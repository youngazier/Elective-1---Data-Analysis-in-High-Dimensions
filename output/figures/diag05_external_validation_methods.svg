<circle cx="415" cy="300" r="7" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="415" y="287" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16A34A">C5</text>
<circle cx="482" cy="300" r="7" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="482" y="287" text-anchor="middle" font-size="10.5" font-weight="700" fill="#EA580C">C3</text>
<circle cx="555" cy="300" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="555" y="287" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7C3AED">C2</text>
<text x="490" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Non-parametric (no bell curve needed)</text>
