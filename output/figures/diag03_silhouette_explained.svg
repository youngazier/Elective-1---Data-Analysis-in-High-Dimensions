<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
  <rect width="920" height="440" fill="#FFFFFF"/>
  <style>text { font-family: Noto Sans, DejaVu Sans, Arial, sans-serif; }</style>
<text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">How Silhouette Width s(i) Measures Cluster Fit for Student i</text>
<text x="460" y="60" text-anchor="middle" font-size="13.5" fill="#475569">Compares how close student i is to their own cluster a(i) versus the nearest neighbouring cluster b(i)</text>
<ellipse cx="215" cy="195" rx="135" ry="95" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="215" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">Own Cluster</text>
<ellipse cx="565" cy="195" rx="125" ry="90" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
<text x="565" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">Nearest Neighbour Cluster</text>
<ellipse cx="815" cy="195" rx="75" ry="70" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="815" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#94A3B8">Far Cluster</text>
<text x="815" y="112" text-anchor="middle" font-size="11" fill="#94A3B8">(ignored by b)</text>
<circle cx="790" cy="175" r="5.5" fill="#CBD5E1"/>
<circle cx="835" cy="185" r="5.5" fill="#CBD5E1"/>
<circle cx="812" cy="225" r="5.5" fill="#CBD5E1"/>
<line x1="255" y1="198" x2="145" y2="160" stroke="#2563EB" stroke-width="2.2"/>
<line x1="255" y1="198" x2="195" y2="145" stroke="#2563EB" stroke-width="2.2"/>
<line x1="255" y1="198" x2="145" y2="225" stroke="#2563EB" stroke-width="2.2"/>
<line x1="255" y1="198" x2="210" y2="250" stroke="#2563EB" stroke-width="2.2"/>
<line x1="255" y1="198" x2="505" y2="155" stroke="#EA580C" stroke-width="2.0" stroke-dasharray="6,4"/>
<line x1="255" y1="198" x2="585" y2="145" stroke="#EA580C" stroke-width="2.0" stroke-dasharray="6,4"/>
<line x1="255" y1="198" x2="520" y2="238" stroke="#EA580C" stroke-width="2.0" stroke-dasharray="6,4"/>
<line x1="255" y1="198" x2="620" y2="215" stroke="#EA580C" stroke-width="2.0" stroke-dasharray="6,4"/>
<circle cx="145" cy="160" r="6.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="195" cy="145" r="6.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="145" cy="225" r="6.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="210" cy="250" r="6.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="505" cy="155" r="6.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="585" cy="145" r="6.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="520" cy="238" r="6.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="620" cy="215" r="6.5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="255" cy="198" r="13" fill="#1E293B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="255" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">i</text>
<rect x="115" y="185" width="92" height="24" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
<text x="161" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">a(i) = mean</text>
<rect x="368" y="176" width="96" height="24" rx="6" fill="#FFEDD5" stroke="#FB923C"/>
<text x="416" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">b(i) = mean</text>
<rect x="40" y="318" width="840" height="96" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="460" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">Formula:   s(i) = [ b(i) − a(i) ] / max{ a(i), b(i) }     (always between −1 and +1)</text>
<rect x="60" y="356" width="256" height="46" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.3"/>
<text x="188" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B91C1C">s(i) &lt; 0  (Bad fit)</text>
<text x="188" y="393" text-anchor="middle" font-size="11.5" fill="#475569">a(i) &gt; b(i): closer to neighbours</text>
<rect x="330" y="356" width="256" height="46" rx="7" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.3"/>
<text x="458" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A16207">s(i) ≈ 0  (On border)</text>
<text x="458" y="393" text-anchor="middle" font-size="11.5" fill="#475569">a(i) ≈ b(i): sits between 2 clusters</text>
<rect x="600" y="356" width="256" height="46" rx="7" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.3"/>
<text x="728" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">s(i) → +1  (Great fit)</text>
<text x="728" y="393" text-anchor="middle" font-size="11.5" fill="#475569">a(i) ≪ b(i): tight inside own group</text>
</svg>